[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasentinel-uk"
version = "0.1.0"
description = "UK Sewage Spill Forecasting, River IoT Telemetry, Hydrological Network Graphs, and Ofwat PR24 / Environment Act Compliance Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pandera>=0.20",
    "duckdb>=1.0",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "mapie>=0.8",
    "torch>=2.2",
    "mlflow>=2.12",
    "langgraph>=0.2",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "tabulate>=0.9",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
ui = [
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
