services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: aquasentinel-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquasentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquasentinel_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aquasentinel_uk}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquasentinel} -d ${POSTGRES_DB:-aquasentinel_uk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: aquasentinel-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquasentinel-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquasentinel}:${POSTGRES_PASSWORD:-aquasentinel_dev}@pgvector:5432/${POSTGRES_DB:-aquasentinel_uk}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AQUASENTINEL_GDPR_SALT: ${AQUASENTINEL_GDPR_SALT:-uk-ea-gdpr-dev-salt-2026}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./docs:/app/docs
    depends_on:
      pgvector:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  pgvector_data:
